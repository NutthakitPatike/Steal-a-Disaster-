<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1120" width="1200" height="1120" role="img" aria-labelledby="title desc">
<title id="title">Steal a Disaster — Map Concept v2, linear Zone progression</title>
<desc id="desc">The original seven-bay horizontal hub at the bottom connects to a long single forward route through launch Zones 1–5, then future Zones 6–7. A Secret Crate Admin Abuse spawn example occurs inside Zone 2; expansion continues forward rather than branching. Dimensions are not to scale.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101a2f"/><stop offset="1" stop-color="#101627"/></linearGradient>
 <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6eddd4"/></marker>
 <style>
 .title{font:700 27px 'Segoe UI',Arial,sans-serif;fill:#ecf6ff}
 .major{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#ecf6ff}
 .medium{font:650 15px 'Segoe UI',Arial,sans-serif;fill:#e8f5ff}
 .small{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#c4d5e8}
 .tiny{font:500 11px 'Segoe UI',Arial,sans-serif;fill:#b8cadd}
 .step{stroke:#6eddd4;stroke-width:5;fill:none;marker-end:url(#arr);stroke-linecap:round}
 </style>
</defs>
<rect width="1200" height="1120" fill="url(#bg)"/>
